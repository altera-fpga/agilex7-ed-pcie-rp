header:
  version: 17
  includes:
    - kas/machine.yml
    - kas/bsp.yml

# YOCTO_TMPDIR: node-local path for BitBake TMPDIR (OE sanity rejects NFS TMPDIR)
env:
  YOCTO_TMPDIR: null
  GITHUB_ACTIONS: null

target:
  - console-image-minimal
  - gsrd-console-image

repos:
  bitbake:
    url: https://github.com/openembedded/bitbake.git
    branch: "2.18"
    layers:
      .: disabled
  openembedded-core:
    url: https://github.com/openembedded/openembedded-core.git
    branch: wrynose
    layers:
      meta:
  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    branch: wrynose
    layers:
      meta-poky:
      meta-yocto-bsp:
  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    branch: wrynose
    layers:
      meta-oe:
      meta-python:
      meta-networking:
  meta-clang:
    url: https://github.com/kraj/meta-clang.git
    branch: wrynose
  meta-altera-fpga:
    url: https://github.com/altera-fpga/meta-altera-fpga.git
    branch: wrynose
    layers:
      meta-altera-bsp:
      meta-altera-platform:
  meta-custom:
    path: meta-custom

local_conf_header:
  git-premirrors: |
    # git:// (port 9418) hangs on this network and these hosts have no https git; use GitHub mirrors.
    PREMIRRORS:prepend = " \
        git://git.kernel.dk/fio.git git://github.com/axboe/fio.git;protocol=https \
        git://git.infradead.org/mtd-utils.git git://github.com/sigma-star/mtd-utils.git;protocol=https \
        "
  boot-source: |
    SSBL_BOOT_SOURCE ?= "mmc0"
    KERNEL_BOOTARGS_SD_MMC ?= ""

  device-tree: |
    CUSTOM_UBOOT_DEVICE_TREE = "0"
    CUSTOM_LINUX_DEVICE_TREE = "0"

  # RBF file should be placed in meta-custom/recipes-fpga/fpga-bitstream/files/
  fpga-bitstream: |
    FPGA_ENABLE_CORE_PGM ?= "1"
    FPGA_RBF_FILE ?= "baseline.core.rbf"

  kernel-modules: |
    KERNEL_MODULE_PROBECONF = "cfg80211"
    module_conf_cfg80211 = "blacklist cfg80211"

  build-params: |
    PARALLEL_MAKE = "${@'-j 8' if d.getVar('GITHUB_ACTIONS') == 'true' else '-j 32'}"
    BB_NUMBER_THREADS = "${@'8' if d.getVar('GITHUB_ACTIONS') == 'true' else '32'}"

  ci-tmpdir: |
    # CI sets YOCTO_TMPDIR to node-local scratch; leave default under build/ for local builds
    TMPDIR = "${@d.getVar('YOCTO_TMPDIR') or '${TOPDIR}/tmp'}"

  ci-disk: |
    # Shrink TMPDIR footprint; stop before the disk fills up
    INHERIT += "rm_work"
    BB_DISKMON_DIRS = "STOPTASKS,${TMPDIR},2G,100K HALT,${TMPDIR},1G,10K"
